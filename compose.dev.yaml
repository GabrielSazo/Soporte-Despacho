services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sestel_dev
      POSTGRES_USER: sestel
      POSTGRES_PASSWORD: sestel-dev-password
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sestel -d sestel_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: sestel-dev-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
      POSTGRES_DB: sestel_dev
      POSTGRES_USER: sestel
      POSTGRES_PASSWORD: sestel-dev-password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: noreply@sestel.local
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8010/api
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_dev_data:
  frontend_node_modules:
