services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sestel}
      POSTGRES_USER: ${POSTGRES_USER:-sestel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sestel} -d ${POSTGRES_DB:-sestel}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput || true && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      POSTGRES_DB: ${POSTGRES_DB:-sestel}
      POSTGRES_USER: ${POSTGRES_USER:-sestel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@sestel.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SECURE_PROXY_SSL_HEADER: "true"   # nginx termina TLS y envía X-Forwarded-Proto
      # --- Agente IA (apagado por defecto; ver Runbook §6) ---
      IA_VISION_ENABLED: ${IA_VISION_ENABLED:-false}
      IA_AUTO_APPLY: ${IA_AUTO_APPLY:-false}
      OLLAMA_HOST: http://ollama:11434   # red interna del compose; el puerto NO se publica al exterior
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
      OLLAMA_REASON_MODEL: ${OLLAMA_REASON_MODEL:-qwen3:4b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-sestel}
      POSTGRES_USER: ${POSTGRES_USER:-sestel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      # --- Agente IA (el worker ejecuta los análisis; ver Runbook §6) ---
      IA_VISION_ENABLED: ${IA_VISION_ENABLED:-false}
      IA_AUTO_APPLY: ${IA_AUTO_APPLY:-false}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
      OLLAMA_REASON_MODEL: ${OLLAMA_REASON_MODEL:-qwen3:4b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started

  ollama:
    # Modelos locales para el agente IA (visión + razonamiento). Opcional: el sistema
    # funciona completo sin ella (flujo continúa sin IA). Puerto NO publicado: solo
    # la red interna del compose lo alcanza en http://ollama:11434.
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Modelos residentes en RAM 30 min tras cada uso: tickets seguidos sin recargar
      # (~5.5 GB de RAM ocupados mientras están residentes).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_models:/root/.ollama   # pesos de los modelos; sobreviven a rebuilds
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs        # certificados TLS (fuera de git; scripts/generar_certificado.sh)
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - api

volumes:
  postgres_data:
  media:
  static:
  ollama_models:
