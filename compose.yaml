services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sestel
      POSTGRES_USER: sestel
      POSTGRES_PASSWORD: sestel-local-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sestel -d sestel"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: sestel-development-only-change-before-deploying
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175
      POSTGRES_DB: sestel
      POSTGRES_USER: sestel
      POSTGRES_PASSWORD: sestel-local-password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
