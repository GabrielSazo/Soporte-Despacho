# Desarrollo local — Docker Compose
# Uso: docker-compose -f compose.dev.yaml up --build
#
# Servicios:
#   postgres  → localhost:5433 (DB: sestel_dev)
#   api       → localhost:8010 (Django runserver con auto-reload)
#   frontend  → localhost:80 (Vite dev server con hot-reload)
#
# Persistencia:
#   - volumes postgres_dev_data y frontend_node_modules
#   - Para reiniciar limpio: docker-compose -f compose.dev.yaml down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sestel_dev
      POSTGRES_USER: sestel
      POSTGRES_PASSWORD: sestel-dev-password
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sestel -d sestel_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: sestel-dev-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:80,http://127.0.0.1:80
      POSTGRES_DB: sestel_dev
      POSTGRES_USER: sestel
      POSTGRES_PASSWORD: sestel-dev-password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: noreply@sestel.local
      FRONTEND_URL: http://localhost:80
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: /api
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "80:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_dev_data:
  frontend_node_modules:
